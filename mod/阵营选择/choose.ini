//by蚟醛钯烨
[core]
name: choose
class: CustomUnitMetadata
price: 1000
maxHp: 100000000
mass: 500
displayText: 选择阵营
displayDescription: 开局阵营选择信标，决定本局加入人类幸存者或生化感染者\n原作者：蚟醛钯烨
techLevel: 1
nanoFactorySpeed:2
nanoRange:400
useAsBuilder
buildSpeed: 0.0004
overrideAndReplace: commandCenter
#availableInDemo: true
radius: 30
displayRadius: 30
isBio: false
isBuilding: true
selfRegenRate:0.1
softCollisionOnAll: 12

energyMax: 50
energyRegen: 0
energyNeedsToRechargeToFull: true

canRepairBuildings: true
canRepairUnits: true


dieOnConstruct: true

# AI 开局掷一次 0~100 的随机数，决定加入哪个阵营（各 50%）
@memory aiRoll: number


[action_trigger_HPP]
autoTrigger:if self.hasFlag(id=3)
convertTo: 僵尸阵营
buildSpeed: 0
text: TRIGGER
isVisible: false


[action_JS]
#fireTurretXAtGround: 1
price:  energy=50,setFlag=3
addResources:setFlag=3
text: 僵尸阵营
description:选择僵尸阵营
displayType: action
buildSpeed: 0s
pos: 0.1 
canPlayerCancel:false
ai_isDisabled:true

[action_RL]
#fireTurretXAtGround: 1
#price:  -6000
addResources: 6000
text: 人类阵营
description:选择人类阵营
displayType: action
convertTo: ahx
buildSpeed: 0s
pos: 0.2
canPlayerCancel:false
ai_isDisabled:true



[action_AI_ROLL]
autoTrigger: if self.isControlledByAI() and not self.hasFlag(id=5)
setUnitMemory: aiRoll=rnd(0,100)
addResources: setFlag=5
buildSpeed: 0
text: AI_ROLL
isVisible: false

[action_AI_ZOMBIE]
autoTrigger: if self.isControlledByAI() and self.hasFlag(id=5) and memory.aiRoll < 50
convertTo: 僵尸阵营
buildSpeed: 0
text: AI_ZOMBIE
isVisible: false

[action_AI_HUMAN]
autoTrigger: if self.isControlledByAI() and self.hasFlag(id=5) and memory.aiRoll >= 50
addResources: 6000
convertTo: ahx
buildSpeed: 0
text: AI_HUMAN
isVisible: false

[graphics]
total_frames: 1

image:        pause.png
image_wreak:  NONE
image_turret: NONE
#scaleImagesTo: 20
#scaleTurretImagesTo: 9

#AUTO
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]

isMelee: false

canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

#isFixedFiring: true

turretSize: 20
turretTurnSpeed: 3

maxAttackRange: 9
shootDelay: 30

[turret_1]
x: 0
y: 0
isMainNanoTurret: true

[projectile_1]
directDamage: 0
life: 50
instant: true

[projectile_2]
directDamage: 0
life: 50
instant: true
spawnUnit:ahx

[movement]
movementType: AIR
moveSpeed: 0
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12


landOnGround: true


targetHeight: 15
targetHeightDrift: 3

maxTurnSpeed: 0
turnAcceleration: 0.4

moveSlidingMode :true
moveIgnoringBody:true
moveSlidingDir:  181

[ai]
useAsBuilder: true
#noneInBaseExtraPriority: 1
ai_upgradePriority:1



