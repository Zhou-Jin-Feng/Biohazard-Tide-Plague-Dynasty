
[core]
name: crystal
class: CustomUnitMetadata
price: 5000
maxHp: 1800
mass: 9000

generation_credits:5
generation_delay:40

overrideAndReplace: builder
#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,1

#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,1


techLevel: 1
buildSpeed: 0.001
#availableInDemo: true

radius: 35
#displayRadius: 25
isBio: false
isBuilding: true
#stayNeutral: true
#createNeutral: true
resourceRate: 1
disableAllUnitCollisions:true
#canNotBeDirectlyAttacked:true
isUnselectable:true
hideScorchMark:true

[action_trigger_HPP]
autoTrigger:if numberOfUnitsInTeam(withTag='人类阵营', greaterThan=0) 
convertTo: 狙击塔T2
buildSpeed: 0
text: TRIGGER
isVisible: false


[action_trigger_HHP]
autoTrigger:if numberOfUnitsInTeam(withTag='僵尸阵营', greaterThan=0) 
convertTo: 尸坑
buildSpeed: 0
text: TRIGGER
isVisible: false

[graphics]
total_frames: 1

image:        crystal.png
image_wreak:  NONE

#scaleImagesTo: 20
#scaleTurretImagesTo: 9

#AUTO
image_shadow: NONE
shadowOffsetX:1
shadowOffsetY:1


[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0


[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1







