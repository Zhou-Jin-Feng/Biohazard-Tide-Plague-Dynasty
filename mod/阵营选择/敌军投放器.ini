[core]
name: 敌军投放器
class: CustomUnitMetadata
displayText: 敌军投放器
displayDescription: 沙盒调试专用：在脚下投放敌对单位（对所有队伍敌对），用于测试攻防效果\n己方为人类时显示僵尸单位，己方为僵尸时显示人类单位
price: 0
maxHp: 1000000
mass: 500
techLevel: 1
radius: 30
displayRadius: 30
isBio: false
selfRegenRate: 100
softCollisionOnAll: 12

[graphics]
total_frames: 3
image:        choose.png
image_wreak:  NONE
image_turret: NONE
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 5
animation_idle_start: 0
animation_idle_end: 0

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[movement]
movementType: AIR
moveSpeed: 10
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.12
landOnGround: false
targetHeight: 15
targetHeightDrift: 3
maxTurnSpeed: 6.5
turnAcceleration: 0.4
moveSlidingMode: true
moveIgnoringBody: true
moveSlidingDir: 181

